server:
  port: 8080

spring:
  profiles:
    active:
      - "prod"
  application:
    name: accounts
  datasource:
    url: "jdbc:mysql://localhost:3306/accountsdb"
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"

    #config:
   # import: "optional:configserver:http://localhost:8071/"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
management:
  endpoints:
    web:
      exposure:
        include: "*"