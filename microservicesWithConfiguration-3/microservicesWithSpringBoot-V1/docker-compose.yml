name: spring-boot_MS
services:
  accounts:
    image: "saurabh0208/accounts:v1"
    container_name: "account_ms"
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - saurabh_network
    logging:
      driver: "json-file"

  loans:
    image: "saurabh0208/loans:v1"
    container_name: "loans_ms"
    restart: unless-stopped
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - saurabh_network
    logging:
      driver: "json-file"
  cards:
    image: "saurabh0208/cards:v1"
    container_name: "cards_ms"
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - saurabh_network
    logging:
      driver: "json-file"
networks:
  saurabh_network:
    driver: bridge
