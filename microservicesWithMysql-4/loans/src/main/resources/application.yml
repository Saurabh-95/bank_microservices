server:
  port: 8090
spring:
  profiles:
    active: "prod"
  application:
    name: loans
  datasource:
    url: "jdbc:mysql://localhost:3307/loansdb"
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: guest
    password: guest
logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

management:
  endpoints:
    web:
      exposure:
        include: "*"