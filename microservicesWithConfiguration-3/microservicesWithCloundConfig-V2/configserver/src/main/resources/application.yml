spring:
  application:
    name: configserver
  profiles:
    active: git
  #active: native
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/Saurabh-95/config.git"
        #native:
         #search-locations: "file:///C://Users//lenovo//Documents//config"
         #search-locations: classpath:/config
          default-label: main
          clone-on-start: true
          force-pull: true
          timeout: 5
          #for public git repositories user name and password not required
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}
  rabbitmq:
    host: "localhost"
    port: 5672
    username: guest
    password: guest


encrypt:
  key: "hg40ck96"

server:
  port: 8071

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}



