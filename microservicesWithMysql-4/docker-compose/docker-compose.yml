name: spring-boot_MS
services:
  accountsdb:
    container_name: accountsdb
    ports:
      - "3306:3306"
    volumes:
      - S:\bank_microservices\docker-data\accounts-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: accountsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  loansdb:
    container_name: loansdb
    ports:
      - "3307:3306"
    volumes:
      - S:\bank_microservices\docker-data\loans-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: loansdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  cardsdb:
    container_name: cardsdb
    ports:
      - "3308:3306"
    volumes:
      - S:\bank_microservices\docker-data\cards-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: cards
    extends:
      file: common-config.yml
      service: microservice-db-config



  configserver:
    image: "saurabh0208/configserver:${IMAGE_TAG:-v3}"
    container_name: "configserver_ms"
    ports:
      - "8071:8071"
    env_file:
      - .env
    healthcheck:
      #curl command not secure
      #test: "curl --fail --silent localhost:8071/actuator/health/readiness|grep UP || exit 1"
     #===============================#
      # Checks whether the application is ready to handle requests by:
      # 1. Establishing a TCP connection to the application on port 8071.
      # 2. Sending an HTTP GET request to the Spring Boot readiness endpoint.
      # 3. Verifying that the response contains "status":"UP".
      # Docker marks the container as healthy if the readiness check succeeds;
      # otherwise, the health check fails.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost:localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: microservice-base-config
    logging:
      driver: "json-file"

  accounts:
    image: "saurabh0208/accounts:${IMAGE_TAG:-v3}"
    container_name: "account_ms"
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
    depends_on:
      configserver:
        condition: service_healthy
      accountsdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    logging:
      driver: "json-file"

  loans:
    image: "saurabh0208/loans:${IMAGE_TAG:-v3}"
    container_name: "loans_ms"
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb"
    depends_on:
      configserver:
        condition: service_healthy
      loansdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    logging:
      driver: "json-file"


  cards:
    image: "saurabh0208/cards:v3"
    container_name: "cards_ms"
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
    depends_on:
      configserver:
        condition: service_healthy
      cardsdb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    logging:
      driver: "json-file"

networks:
  saurabh_network:
    driver: bridge
